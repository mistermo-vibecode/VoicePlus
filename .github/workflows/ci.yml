name: CI

on:
  push:
  pull_request:
  workflow_call: { }

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/build_setup
      - name: Run Unit Tests + Lint
        run: ./gradlew :app:lintLibreDebug
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lint-report
          path: app/build/reports/**/*.html
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/build_setup
      - name: Run Unit Tests + Lint
        run: ./gradlew voiceUnitTest lintKotlin :app:assembleLibreDebug
      - name: Publish JUnit Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: '**/test-results/**/TEST-*.xml'
          check_name: "Unit Tests"

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/build_setup
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Critical Android Smoke Tests
        run: >-
          ./gradlew :app:voiceDeviceLibreDebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.testInstrumentationRunnerArguments.class=voice.app.AppLaunchSmokeTest,voice.app.SleepTimerIntegrationTest,voice.app.FeatureRegressionTest,voice.app.AndroidAutoMediaButtonTest
      - name: Publish JUnit Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: '**/test-results/**/TEST-*.xml'
          check_name: "Instrumentation Tests"
